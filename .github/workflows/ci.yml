name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci

      - name: Type check (all workspaces)
        run: npm run typecheck

      - name: Security / RLS tests
        run: node --test e2e/security.test.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # Builds both bundles so the isolation check below has something to read.
      - name: Build public web bundle
        run: npm run build:public
      - name: Build admin web bundle
        run: npm run build:admin

      # Fails if any admin-only query reaches the public bundle. This is what
      # keeps the customer/admin split honest as the code changes.
      - name: Verify admin code is absent from the public bundle
        run: npm run verify:isolation
